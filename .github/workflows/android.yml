name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - "src/components/**"
      - "src/lib/**"
      - "src/server/game/**"
      - "src/app/globals.css"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ONLINE_URL: ${{ vars.WORTJAGD_ONLINE_URL }}
      WORTJAGD_ONLINE_URL: ${{ vars.WORTJAGD_ONLINE_URL }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Web-Teil bauen
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Signaturschlüssel bereitstellen
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/wortjagd.apk"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – Debug-APK wird gebaut. Updates erfordern dann Neuinstallation."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/wortjagd.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wortjagd-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/wortjagd.apk

      - name: Release anlegen (nur bei Tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/wortjagd.apk
          generate_release_notes: true
